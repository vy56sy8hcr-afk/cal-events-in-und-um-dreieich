name: Events täglich aktualisieren
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: ICS erzeugen
        run: |
          cat > generate_calendar.py <<'PY'
          from datetime import date, datetime, timedelta
          from pathlib import Path
          import calendar
          OUT = Path("cal-events-in-und-um-dreieich.ics")
          TODAY = date.today()
          def add_months(d, months):
              y = d.year + (d.month - 1 + months) // 12
              m = (d.month - 1 + months) % 12 + 1
              day = min(d.day, calendar.monthrange(y, m)[1])
              return date(y, m, day)
          START = add_months(TODAY, -6)
          END = add_months(TODAY, 16)
          events = []
          def add(start, end, title, description="", location=""):
              events.append((start, end, title, description, location))
          def nth_weekday(year, month, weekday, n):
              d = date(year, month, 1)
              return d + timedelta(
                  days=(weekday - d.weekday()) % 7 + 7 * (n - 1)
              )
          def last_weekday(year, month, weekday):
              d = date(year, month, calendar.monthrange(year, month)[1])
              return d - timedelta(days=(d.weekday() - weekday) % 7)
          def easter(year):
              a = year % 19
              b = year // 100
              c = year % 100
              d = b // 4
              e = b % 4
              f = (b + 8) // 25
              g = (b - f + 1) // 3
              h = (19*a + b - d - g + 15) % 30
              i = c // 4
              k = c % 4
              l = (32 + 2*e + 2*i - h - k) % 7
              m = (a + 11*h + 22*l) // 451
              month = (h + l - 7*m + 114) // 31
              day = ((h + l - 7*m + 114) % 31) + 1
              return date(year, month, day)
          def first_advent(year):
              d = date(year, 11, 30)
              return d - timedelta(days=(d.weekday() + 1) % 7)
          def fmt(d):
              names = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"]
              return f"{names[d.weekday()]} {d:%d.%m.%Y}"
          known = {
              "Altstadtfest Neu-Isenburg": {
                  2027: (date(2027, 6, 18), date(2027, 6, 20))
              },
              "Kerb Warmup": {
                  2027: (date(2027, 7, 31), date(2027, 7, 31))
              },
              "Hayner Kerb": {
                  2026: (date(2026, 5, 22), date(2026, 5, 27)),
                  2027: (date(2027, 5, 14), date(2027, 5, 19))
              },
              "Sprendlinger Kerb": {
                  2026: (date(2026, 8, 14), date(2026, 8, 18)),
                  2027: (date(2027, 8, 13), date(2027, 8, 17))
              },
              "Götzenhainer Kerb": {
                  2026: (date(2026, 9, 18), date(2026, 9, 21)),
                  2027: (date(2027, 9, 17), date(2027, 9, 20))
              },
              "Offenthaler Kerb": {
                  2026: (date(2026, 10, 30), date(2026, 11, 3)),
                  2027: (date(2027, 10, 29), date(2027, 11, 2))
              }
          }
          def kerben(year):
              pfingsten = easter(year) + timedelta(days=49)
              hayner = (
                  pfingsten - timedelta(days=2),
                  pfingsten + timedelta(days=3)
              )
              spr = nth_weekday(year, 8, 4, 2)
              spr = (spr, spr + timedelta(days=4))
              goetz_sonntag = nth_weekday(year, 9, 6, 3)
              goetz = (
                  goetz_sonntag - timedelta(days=2),
                  goetz_sonntag + timedelta(days=1)
              )
              off_sonntag = nth_weekday(year, 11, 6, 1)
              off = (
                  off_sonntag - timedelta(days=2),
                  off_sonntag + timedelta(days=2)
              )
              result = {
                  "Hayner Kerb": list(hayner),
                  "Sprendlinger Kerb": list(spr),
                  "Götzenhainer Kerb": list(goetz),
                  "Offenthaler Kerb": list(off)
              }
              for name in result:
                  if year in known.get(name, {}):
                      result[name] = list(known[name][year])
              return result
          def kerb_note(year):
              k = kerben(year)
              return f"""Die Kerben und ihre Termine {year} in Dreieich:
          Hayner Kerb (Dreieichenhain)
          {fmt(k["Hayner Kerb"][0])} – {fmt(k["Hayner Kerb"][1])}
          Kerb Sprendlingen
          {fmt(k["Sprendlinger Kerb"][0])} – {fmt(k["Sprendlinger Kerb"][1])}
          Kerb Götzenhain
          {fmt(k["Götzenhainer Kerb"][0])} – {fmt(k["Götzenhainer Kerb"][1])}
          Kerb Offenthal
          {fmt(k["Offenthaler Kerb"][0])} – {fmt(k["Offenthaler Kerb"][1])}"""
          # Kerben
          for year in range(START.year, END.year + 1):
              k = kerben(year)
              note = kerb_note(year)
              add(
                  k["Hayner Kerb"][0],
                  k["Hayner Kerb"][1] + timedelta(days=1),
                  f"🎈{308 + year - 2026}. Hayner Kerb {year}",
                  note,
                  "Dreieichenhain"
              )
              add(
                  k["Sprendlinger Kerb"][0],
                  k["Sprendlinger Kerb"][1] + timedelta(days=1),
                  f"🎈{310 + year - 2026}. Sprendlinger Kerb {year}",
                  note,
                  "Sprendlingen"
              )
              add(
                  k["Götzenhainer Kerb"][0],
                  k["Götzenhainer Kerb"][1] + timedelta(days=1),
                  f"🎈{250 + year - 2026}. Götzenhainer Kerb {year}",
                  note,
                  "Götzenhain"
              )
              add(
                  k["Offenthaler Kerb"][0],
                  k["Offenthaler Kerb"][1] + timedelta(days=1),
                  f"🎈Offenthaler Kerb {year}",
                  note,
                  "Offenthal"
              )
          # Kerb Warmup – letzter Samstag im Juli,
          # mit bekanntem 2027-Termin als Vorrang.
          for year in range(START.year, END.year + 1):
              d = last_weekday(year, 7, 5)
              if year in known["Kerb Warmup"]:
                  d = known["Kerb Warmup"][year][0]
              add(
                  d,
                  d + timedelta(days=1),
                  f"🎈Kerb Warmup auf dem Lindenplatz {year}",
                  "",
                  "Lindenplatz, Dreieich-Sprendlingen"
              )
          # Altstadtfest Neu-Isenburg – bestätigter Termin.
          for year in range(START.year, END.year + 1):
              if year in known["Altstadtfest Neu-Isenburg"]:
                  s, e = known["Altstadtfest Neu-Isenburg"][year]
                  add(
                      s,
                      e + timedelta(days=1),
                      f"🎈Altstadtfest Neu-Isenburg {year}",
                      "",
                      "Neu-Isenburg"
                  )
          # Langen
          for year in range(START.year, END.year + 1):
              # Weinfest: Donnerstag bis Sonntag des
              # ersten vollständigen August-Wochenendes.
              sunday = nth_weekday(year, 8, 6, 1)
              start = sunday - timedelta(days=3)
              add(
                  start,
                  sunday + timedelta(days=1),
                  f"🍷Weinfest Langen {year}",
                  "Jährliches Weinfest in Langen.",
                  "Langen"
              )
              # Langener Kerb: erstes September-Wochenende.
              sunday = nth_weekday(year, 9, 6, 1)
              start = sunday - timedelta(days=1)
              add(
                  start,
                  sunday + timedelta(days=4),
                  f"🎈Langener Kerb {year}",
                  "Langener Kerb am ersten September-Wochenende.",
                  "Langen"
              )
              add(
                  sunday,
                  sunday + timedelta(days=1),
                  f"🛍️Langener Markt {year}",
                  "Langener Markt.",
                  "Langen"
              )
              add(
                  sunday,
                  sunday + timedelta(days=1),
                  f"🎨Art Promenade Langen {year}",
                  "Art Promenade.",
                  "Langen"
              )
          # Offene Gärten Buchschlag – dritter Sonntag im Juni.
          for year in range(START.year, END.year + 1):
              sunday = nth_weekday(year, 6, 6, 3)
              add(
                  sunday,
                  sunday + timedelta(days=1),
                  f"🌿Offene Gärten Buchschlag {year}",
                  "",
                  "Buchschlag"
              )
          # Weihnachtsmärkte Dreieich.
          for year in range(START.year, END.year + 1):
              a1 = first_advent(year)
              a2 = a1 + timedelta(days=7)
              a3 = a1 + timedelta(days=14)
              a4 = a1 + timedelta(days=21)
              add(
                  a1 - timedelta(days=2),
                  a1 + timedelta(days=1),
                  "🎅🏼Adventsmarkt Sprendlingen",
                  """1. Advent Adventsmarkt Sprendlingen Lindenplatz, Sprendlingen
          Freitag von 17–21 Uhr
          Samstag und Sonntag von 15–21 Uhr
          Seit 2000.
          Veranstalter: AKTIVes Dreieich e.V.""",
                  "Lindenplatz, Sprendlingen"
              )
              add(
                  a2 - timedelta(days=1),
                  a3 + timedelta(days=1),
                  "🎅🏼Hayner Weihnachtsmarkt",
                  """2. und 3. Advent: Hayner Weihnachtsmarkt Dreieichenhain, Fahrgasse
          Samstag je von 15–20:30 Uhr
          Sonntag je von 14–20 Uhr
          Seit 1978.
          2028: ⭐️5o Jahre.""",
                  "Fahrgasse, Dreieichenhain"
              )
              add(
                  a4 - timedelta(days=1),
                  a4 + timedelta(days=1),
                  "🎅🏼Weihnachtsmarkt Offenthal",
                  """4. Advent: Weihnachtsmarkt Offenthal
          Kirchgasse, im Kirchgarten und am Alten Rathaus
          Samstag von 16–22 Uhr
          Sonntag von 14–20 Uhr
          Wenn Weihnachten auf einen Sonntag fällt:
          Freitag von 16–22 Uhr
          Samstag von 14–20 Uhr
          Veranstalter: Kulturverein Dreieich e.V.""",
                  "Kirchgasse, Offenthal"
              )
          # 50 Jahre Dreieich – bekannte Termine.
          if START <= date(2027, 1, 1) <= END:
              add(
                  date(2027, 1, 1),
                  date(2027, 1, 2),
                  "⭐️5o Jahre Dreieich – Eröffnung",
                  "",
                  "Dreieich"
              )
          if START <= date(2027, 1, 17) <= END:
              add(
                  date(2027, 1, 17),
                  date(2027, 1, 18),
                  "⭐️5o Jahre Dreieich – Neujahrskonzert / Akademische Feier",
                  "",
                  "Dreieich"
              )
          # Nur Termine im Fenster und keine Duplikate.
          unique = {}
          for event in events:
              start, end, title, description, location = event
              if end <= START or start > END:
                  continue
              key = (start, end, title, location)
              unique[key] = event
          events = sorted(
              unique.values(),
              key=lambda x: (x[0], x[2])
          )
          def esc(value):
              return (
                  str(value)
                  .replace("\\", "\\\\")
                  .replace(";", "\\;")
                  .replace(",", "\\,")
                  .replace("\n", "\\n")
              )
          now = datetime.utcnow().strftime("%Y%m%dT%H%M%SZ")
          lines = [
              "BEGIN:VCALENDAR",
              "VERSION:2.0",
              "PRODID:-//Events in und um Dreieich//DE",
              "CALSCALE:GREGORIAN",
              "METHOD:PUBLISH",
              "X-WR-CALNAME:Events in und um Dreieich",
              "X-WR-TIMEZONE:Europe/Berlin"
          ]
          for i, (start, end, title, description, location) in enumerate(events):
              lines.extend([
                  "BEGIN:VEVENT",
                  f"UID:event-{start:%Y%m%d}-{i}@dreieich",
                  f"DTSTAMP:{now}",
                  f"DTSTART;VALUE=DATE:{start:%Y%m%d}",
                  f"DTEND;VALUE=DATE:{end:%Y%m%d}",
                  f"SUMMARY:{esc(title)}"
              ])
              if description:
                  lines.append(f"DESCRIPTION:{esc(description)}")
              if location:
                  lines.append(f"LOCATION:{esc(location)}")
              lines.append("END:VEVENT")
          lines.append("END:VCALENDAR")
          OUT.write_text(
              "\r\n".join(lines) + "\r\n",
              encoding="utf-8"
          )
          print(f"ICS erstellt: {OUT}")
          print(f"Zeitraum: {START} bis {END}")
          print(f"Termine: {len(events)}")
          PY
          python generate_calendar.py
      - name: Änderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cal-events-in-und-um-dreieich.ics
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Kalender automatisch aktualisieren"
            git push
