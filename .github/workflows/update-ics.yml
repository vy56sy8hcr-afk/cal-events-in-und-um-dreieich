name: Kalender täglich aktualisieren
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Quellen prüfen
        continue-on-error: true
        run: python pruefe_quellen.py
      - name: ICS erzeugen
        run: python build_ics.py
      - name: Änderungen speichern
        run: |
          git config user.name "kalender-bot"
          git config user.email "kalender-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Keine Änderungen"
          else
            git commit -m "Kalender aktualisiert $(date -u +%F)"
            git pull --rebase
            git push
          fi
